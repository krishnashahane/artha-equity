services:
  artha:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Set APP_AUTH_PASSWORD in .env before starting}
    ports:
      # Loopback by default; set APP_BIND=0.0.0.0 only behind your own TLS proxy/firewall.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - artha-research:/app/data/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  artha-research:
